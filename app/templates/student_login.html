{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen w-full bg-slate-50 flex flex-col items-center pt-20">
    <nav class="w-full max-w-md px-6 flex justify-between items-center mb-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-teal-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-teal-500/30">
                <i class="fa-solid fa-user-graduate"></i>
            </div>
            <span class="font-bold text-xl text-slate-800 tracking-wide">Portal Alumno</span>
        </div>
        <a href="{{ url_for('main.home') }}" class="text-slate-500 hover:text-teal-600 font-medium transition-colors">
            <i class="fa-solid fa-arrow-left mr-2"></i> Volver
        </a>
    </nav>

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-teal-600 px-8 py-8 text-center">
            <h2 class="text-2xl font-bold text-white mb-2">Iniciar Sesión</h2>
            <p class="text-teal-100">Ingresa tus credenciales institucionales</p>
        </div>
        
        <form action="{{ url_for('main.student_login_post') }}" method="POST" class="p-8 space-y-6">
            {% if error %}
            <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center font-medium">
                {{ error }}
            </div>
            {% endif %}
            
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-700">Correo Institucional</label>
                <div class="relative">
                    <input type="email" name="email" required class="w-full pl-10 pr-4 py-3 rounded-xl border-slate-300 shadow-sm focus:border-teal-500 focus:ring-teal-500" placeholder="ejemplo@alumno.edu" value="carlos.lopez@alumno.edu">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400"></i>
                </div>
                <p class="text-xs text-teal-600 mt-1">Usa "carlos.lopez@alumno.edu" para la demo.</p>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-700">Contraseña / NIP</label>
                <div class="relative">
                    <input type="password" name="password" class="w-full pl-10 pr-4 py-3 rounded-xl border-slate-300 shadow-sm focus:border-teal-500 focus:ring-teal-500" placeholder="••••••••">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400"></i>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-teal-500/30 transition-all transform hover:-translate-y-0.5">
                    Ingresar al Portal
                </button>
            </div>
            
            <div class="text-center mt-6 space-y-2">
                <a href="#" class="block text-sm text-teal-600 hover:text-teal-700 font-medium">¿Olvidaste tu contraseña?</a>
                <p class="text-sm text-slate-500">¿No tienes cuenta? <a href="{{ url_for('main.student_register') }}" class="text-teal-600 hover:text-teal-700 font-bold">Regístrate aquí</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
